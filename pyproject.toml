[project]
name = "fediec"
version = "0.1.0"
description = "Federated Intent-Execution Contracts for Mobile-Controlled IoT Security"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "polars>=1.0",
    "pandera[polars]>=0.20",
    "duckdb>=1.0",
    "torch>=2.3",
    "flwr>=1.9",
    "scikit-learn>=1.5",
    "safetensors>=0.4",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.scripts]
fediec = "fediec.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "semgrep>=1.78",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fediec"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN", "RUF", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
